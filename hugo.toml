theme = 'PaperMod'
baseURL = 'https://sujiantao.github.io/'
locale = 'en-us'
title = 'sujiantao'


# 基础语言代码，用于 HTML 的 lang 属性和 RSS
languageCode = "zh-cn"

# 默认内容语言（必须与后面 [languages.zh] 的 key 对应）
defaultContentLanguage = "zh"

# 开启中日韩语言支持
# 这一项对你非常重要，否则 Hugo 无法正确统计中文字数，导致阅读时间显示错误
hasCJKLanguage = true

[languages.zh]
    languageName = "简体中文"
    contentDir = "content"
    weight = 1
    # 该语言环境下的站点标题
    title = "sujiantao"

    [languages.zh.params]
        # 这里可以放置特定于中文的参数
        description = "个人技术记录"

[params]
    comments = true
    # 使用 2006-01-02 这种占位符（这是 Go 语言的特殊日期写法）
    DateFormat = "2006年01月02日"
    showFirstFullPost = false
    displayFullPost = false

[services]
  [services.googleAnalytics]
    id = "G-G5QEHDNGYK"


[[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts"
    weight = 10

[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags"
    weight = 20

[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories"
    weight = 30

[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search"
    weight = 40

[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about"
    weight = 50

[outputs]
    home = [ "HTML", "RSS", "JSON" ]
